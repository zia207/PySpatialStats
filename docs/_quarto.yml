project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - getting_started.html

website:
  title: "PyGWmodel"
  description: "A comprehensive Python package for Geographically Weighted Modeling"
  site-url: https://zia207.github.io/PyGWModel/
  repo-url: https://github.com/zia207/PyGWModel
  repo-branch: main
  page-navigation: true
  back-to-top-navigation: true
  search:
    location: sidebar
    type: textbox
  page-footer:
    right: "This page is built with [Quarto](https://quarto.org/)."
    left: "&copy; PyGWmodel Contributors, 2026"
  navbar:
    background: primary
    left:
      - text: Home
        href: index.qmd
      - text: Tutorial
        href: ../TUTORIAL.md
      - text: Getting Started
        href: getting_started.html
      - text: Examples
        href: ../examples/notebooks/00_geographically_weighted_models_introductions.ipynb
    right:
      - icon: github
        href: https://github.com/zia207/PyGWModel/
        aria-label: GitHub

  sidebar:
    logo: "images/banner_PyGWModel.png"
    pinned: true
    border: true
    align: center
    search: true
    style: "docked"
    collapse-level: 1
    contents:
      - text: "Package Overview"
        href: index.qmd
      - section: "**Models**"
        contents:
          - text: "GWR & MGWR"
            href: ../TUTORIAL.md#linear-models
          - text: "GW Machine Learning"
            href: ../TUTORIAL.md#ensemble-models
          - text: "GNNWR & GTNNWR"
            href: ../TUTORIAL.md#deep-learning-models
      - section: "**Resources**"
        contents:
          - text: "Full Tutorial"
            href: ../TUTORIAL.md
          - text: "Getting Started"
            href: getting_started.html
          - text: "Example Notebook"
            href: ../examples/notebooks/00_geographically_weighted_models_introductions.ipynb

tbl-cap-location: top
title-block-banner: true

execute:
  enabled: false
  echo: true
  warning: false
  message: false
  freeze: auto

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    highlight-style: github
    fontsize: 1.1em
    linestretch: 1.6
    code-fold: show
    code-tools: false
    code-copy: true
    code-link: true
    smooth-scroll: true
    toc: true
    toc-depth: 4
    toc-title: "On This Page"
    number-sections: false
    fig-align: center
    df-print: paged
    grid:
      sidebar-width: 350px
      body-width: 1200px
      margin-width: 250px
      gutter-width: 1.5rem
